services:
  - type: web
    name: expense-assistant
    env: docker
    plan: free
    region: singapore
    disk:
      name: expense-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TZ
        value: Asia/Taipei
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
